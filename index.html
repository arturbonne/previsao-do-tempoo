<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="index.css">  

</head>


<body>
    <div id="container">
        <h1>Previsão do tempo</h1>
        <p>Consulte a previsão do tempo para qualquer cidade do Brasil!</p>

    <div id="buscarbar">
      <input 
      type="text" 
      id="cidadeInput" 
      placeholder="Digite o nome da cidade"
      >

        <button id="buscarBtn"
        >Buscar</button>
        </div>

        <div id="resultado">
         <h2 id="cidadeNome">cidade</h2>

        <div class="grid-info">

        <div class="icone">
         <img class="icones" 
        src="./clima/temp-vermelho.png" 
        alt="Ícone da temperatura maxima">
        </div>    

        <div class="icone">
         <img class="icones" 
        src="./clima/termo-azul.png" 
        alt="Ícone da temperatura minima">
        </div>    

        <div class="icone">
            <img class="icones" 
            src="./clima/umidade.png" 
            alt="Ícone de umidade">
        </div>

        <div class="icone">
            <img class="icones"
            src="./clima/vento.png" 
            alt="Ícone de vento">
        </div>

        </div>

        
    </div>
 </body>
</html>
