<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="index.css">  

</head>
<body>
    <div id="container">
        <h1>Previsão do tempo</h1>
        <p>Consulte a previsão do tempo para qualquer cidade do Brasil!</p>
    <div id="buscarbar">
      <input type="text" id="cidadeInput" placeholder="Digite o nome da cidade">
        <button id="buscarBtn">Buscar</button>
        <div id="resultado">
            <h2 id="cidadeNome">cidade</h2>
            <p id="temperatura max"></p>
            <p id="umidade"></p>
            <p id="tempo min"></p>
            <p id="vento"></p>

        </div>
    </div>
