<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="index.css">  

</head>


<body>
    <div id="container">
        <h1>Previsão do tempo</h1>
        <p>Consulte a previsão do tempo para qualquer cidade do Brasil!</p>

    <div id="buscarbar">
      <input 
      type="text" 
      id="cidadeInput" 
      placeholder="Digite o nome da cidade">
    


        <button id="buscarBtn"
        >Buscar</button>
        </div>

        <div id="loading">Carregando...
            <div class="spinner"></div>
        </div>

        <div id="resultado">
         <h2 id="cidadeNome">Digite o nome de uma cidade
         </h2>

         <div id="TempAtualContainer"
            >
            <p>
            <span id="tempAtual">--</span>  
            <br>
            <span id="clima">--</span>
            </p>
            <img id="climaIcone" src="" alt="Ícone do clima">
    
            

        <div class="grid-info">
        
        <div class="icones">
            <img  
            src="./clima/temp-vermelho.png" 
            alt="Ícone da temperatura maxima">
            <p class="status">Temp.Max
            <br>
            <span id="tempMax">--</span> °C
        </p>
        </div>    

        <div class="icones">
            <img 
            src="./clima/termo-azul.png" 
            alt="Ícone da temperatura minima">
            <p class="status">Temp.Min
            <br>
            <span id="tempMin">--</span> °C
            </p>
        </div>    

        <div class="icones">
            <img 
            src="./clima/umidade.png" 
            alt="Ícone de umidade">
            <p class="status">Umidade
            <br>
            <span id="umidade">--</span> %
        </p>
        </div>

        <div class="icones">
            <img 
            src="./clima/vento.png" 
            alt="Ícone de vento">
            <p class="status">Vento
            <br>
            <span id="vento">--</span> km/h
        </p>
        </div>

        </div>

        
    </div>

    <script src="index.js"></script>

 </body>
</html>
