<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="index.css">  

</head>


<body>
    <div id="container">
        <h1>Previsão do tempo</h1>
        <p>Consulte a previsão do tempo para qualquer cidade do Brasil!</p>

    <div id="buscarbar">
      <input 
      type="text" 
      id="cidadeInput" 
      placeholder="Digite o nome da cidade"
      >

        <button id="buscarBtn"
        >Buscar</button>
        </div>

        <div id="resultado">
         <h2 id="cidadeNome">cidade</h2>

         <div id="temperatura">

        <div class="grid-info">

        <div class="icones">
            <img  
            src="./clima/temp-vermelho.png" 
            alt="Ícone da temperatura maxima">
            <p class="status">Temp.Max
            <br>
            -- °C</p>
        </div>    

        <div class="icones">
            <img 
            src="./clima/termo-azul.png" 
            alt="Ícone da temperatura minima">
            <p class="status">Temp.Min
            <br>
            -- °C</p>
        </div>    

        <div class="icones">
            <img 
            src="./clima/umidade.png" 
            alt="Ícone de umidade">
            <p class="status">Umidade
            <br>
            -- %</p>
        </div>

        <div class="icones">
            <img 
            src="./clima/vento.png" 
            alt="Ícone de vento">
            <p class="status">Vento-- 
            <br>
            km/h</p>
        </div>

        </div>

        
    </div>
 </body>
</html>
